spring.application.name=academit

# Conexion a base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academit}
spring.datasource.username=${DB_USER:academit}
spring.datasource.password=${DB_PASSWORD:academit}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
